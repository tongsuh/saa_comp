name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Ensure Release Keystore
        run: |
          if [ ! -f "app/release.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias flashalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flashalarm123 \
              -keypass flashalarm123 \
              -dname "CN=DreamCue, O=DreamCue, C=CN"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamCue_Companion-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamCue_Companion-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
